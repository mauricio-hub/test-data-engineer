# Configuración S03 sin credenciales; reportes y make run completo quedan en S04.
pipeline:
  nombre: ingesta_consumos
  batch_size: 5000
origen:
  tipo: archivos_locales
  ruta: data
destino:
  tipo: postgres
  credenciales_locales: .local/ingesta.json
  rol_operativo: ingesta
# BIA_PII_KEY_FILE debe apuntar a la llave externa configurada explícitamente en S02.
